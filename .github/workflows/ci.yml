name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - "foundation/**"
      - "feature/**"
      - "codex/**"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Typecheck
        run: npm run typecheck

      - name: Regression suite
        run: npm test

      - name: Build
        run: npm run build

  mobile:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: mobile
    env:
      CI: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Install mobile dependencies
        run: npm ci

      - name: Typecheck mobile
        run: npm run typecheck

      - name: Lint mobile
        run: npm run lint

      - name: Export iOS, Android and web
        run: npx expo export --platform all --output-dir /tmp/openhouse-mobile-export

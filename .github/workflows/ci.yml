name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - "foundation/**"
      - "feature/**"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm install --ignore-scripts

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build
